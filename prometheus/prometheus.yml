global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'finbrain-java'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['finbrain-java:8080']

  - job_name: 'finbrain-ai'
    static_configs:
      - targets: ['finbrain-ai:8000']

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
