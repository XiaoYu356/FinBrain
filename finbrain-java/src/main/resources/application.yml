server:
  port: 8080

spring:
  application:
    name: finbrain-java
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

jwt:
  secret: ${JWT_SECRET:finbrain-jwt-secret-key-must-be-at-least-256-bits-long-for-security}
  expiration: ${JWT_EXPIRATION:86400000}

minio:
  endpoint: ${MINIO_ENDPOINT:localhost}
  port: ${MINIO_PORT:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:finbrain-docs}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8001}

sentinel:
  transport:
    dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
    port: ${SENTINEL_PORT:8719}
  eager: true
  web-context-unify: false
  filter:
    enabled: true
    url-patterns: /**
  log:
    switch-pid: false

logging:
  level:
    root: INFO
    com.finbrain: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
