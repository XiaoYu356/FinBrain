server:
  port: 8080

spring:
  application:
    name: finbrain-java
  profiles:
    active: dev

jwt:
  secret: ${JWT_SECRET:finbrain-jwt-secret-key-must-be-at-least-256-bits-long-for-security}
  expiration: ${JWT_EXPIRATION:86400000}

minio:
  endpoint: ${MINIO_ENDPOINT:localhost}
  port: ${MINIO_PORT:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:finbrain-docs}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8001}

logging:
  level:
    root: INFO
    com.finbrain: DEBUG
