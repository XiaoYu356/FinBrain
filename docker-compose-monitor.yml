version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: finbrain-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - finbrain-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: finbrain-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=finbrain123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - finbrain-network
    restart: unless-stopped
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: finbrain-node-exporter
    ports:
      - "9100:9100"
    networks:
      - finbrain-network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  finbrain-network:
    external: true
