name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  java-build-and-test:
    name: Java Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finbrain-java
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn clean compile -DskipTests
      
      - name: Run tests
        run: mvn test
      
      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Java Test Results
          path: finbrain-java/target/surefire-reports/*.xml
          reporter: java-junit
      
      - name: Build Docker image
        run: docker build -t finbrain-java:${{ github.sha }} .

  python-build-and-test:
    name: Python AI Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finbrain-ai
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: finbrain-ai/coverage.xml
          flags: python

  vue-build-and-test:
    name: Vue Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finbrain-vue
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: finbrain-vue/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vue-dist
          path: finbrain-vue/dist/

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [java-build-and-test, python-build-and-test, vue-build-and-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Java image
        uses: docker/build-push-action@v5
        with:
          context: ./finbrain-java
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/finbrain-java:latest
      
      - name: Build and push Python image
        uses: docker/build-push-action@v5
        with:
          context: ./finbrain-ai
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/finbrain-ai:latest

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/finbrain
            docker-compose pull
            docker-compose up -d
            docker system prune -f
